
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Titel -->
  <title>
    {% if page.url == "/" or page.url == "/index.html" %}
      {{ site.meta_title }}
    {% else %}
      {{ page.title }} | {{ site.title }}
    {% endif %}
  </title>

  <!-- SEO Meta Description -->
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

   <!-- Kanonische URL (Verhindert Duplicate Content) -->
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">

  <!-- Stylesheets & Favicon -->
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body>

  <!-- Menü -->
  <nav>
    <a href="{{ '/' | relative_url }}">START</a> <!-- index.md -->
    <a href="{{ '/klima' | relative_url }}">KLIMA</a>  <!-- start.md -->
    <a href="{{ '/gesundheit' | relative_url }}">GESUNDHEIT</a>
    <a href="{{ '/kiai' | relative_url }}">KÜNSTLICHE INTELLIGENZ</a>
    <a href="{{ '/rechts' | relative_url }}">FREIHEIT</a>
    <a href="{{ '/geld' | relative_url }}">GELD</a>
    <a href="{{ '/werichbin' | relative_url }}">ÜBER MICH</a>
  </nav>

  <!-- Banner -->
  <header class="banner">
    <img src="{{ '/assets/banner3.png' | relative_url }}" alt="Banner">
  </header>

  <!-- Inhalt -->
  <main>
    {{ content }}
    <!-- AB HIER DEN FOOTER EINFÜGEN -->
<footer style="text-align: center; padding: 20px 10px; margin-top: 40px; border-top: 1px solid #eee; font-size: 14px; font-family: sans-serif;">
    <p>&copy; 2026 The German Truth. Alle Rechte vorbehalten.</p>
    <p>
        <a href="{{ '/impressum.html' | relative_url }}" style="color: #007bff; text-decoration: none; margin: 0 10px;">Impressum</a> | 
        <a href="{{ '/datenschutz.html' | relative_url }}" style="color: #007bff; text-decoration: none; margin: 0 10px;">Datenschutzerklärung</a>
    </p>
</footer>
  </main>

</body>
</html>
